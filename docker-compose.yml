services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mealmesh-db
    restart: always
    environment:
      POSTGRES_DB: mealmesh
      POSTGRES_USER: mealmesh_user
      POSTGRES_PASSWORD: mealmesh_pass
    ports:
      - "5433:5432"
    volumes:
      - mealmesh_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: mealmesh-app
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: mealmesh_user
      DB_PASSWORD: mealmesh_pass
      DB_NAME: mealmesh
      JWT_SECRET: mealmesh_super_secret_key_change_this_later
    ports:
      - "3000:3000"

volumes:
  mealmesh_pgdata: